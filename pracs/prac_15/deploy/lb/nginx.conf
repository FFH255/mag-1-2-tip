# ПЗ №10 — NGINX как Load Balancer перед репликами сервиса tasks.

events {}

http {
    server_tokens off;

    # upstream — пул реплик. Алгоритм по умолчанию — round-robin: запросы
    # раздаются инстансам по очереди. Параметры отказоустойчивости:
    #   max_fails=1      — после 1 неудачного запроса
    #   fail_timeout=5s  — реплика на 5 секунд считается недоступной и
    #                      исключается из ротации; затем NGINX пробует её снова.
    upstream tasks_upstream {
        server tasks_1:8082 max_fails=1 fail_timeout=5s;
        server tasks_2:8082 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://tasks_upstream;

            # Пробрасываем заголовки, важные для сквозной трассировки и авторизации.
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $http_x_request_id;
            proxy_set_header Authorization     $http_authorization;

            # Отказоустойчивость: если реплика вернула сетевую ошибку/таймаут или
            # 5xx — NGINX прозрачно повторит запрос на следующей живой реплике.
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
