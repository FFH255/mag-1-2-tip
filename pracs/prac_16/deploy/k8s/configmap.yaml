# ConfigMap сервиса tasks (ПЗ №16).
#
# Здесь — только НЕсекретные параметры (порт, адреса сервисов, тумблеры).
# Пароль/DSN с паролем лежит отдельно в Secret (см. secret.yaml) — это и есть
# граница ConfigMap vs Secret (контрольный вопрос 4).
#
# Значения выровнены по РЕАЛЬНОМУ main.go сервиса, а не по примеру методички:
#   - методичка показывает AUTH_BASE_URL=http://auth:8081, но tasks ходит в auth
#     по gRPC → корректно AUTH_GRPC_ADDR (services/tasks/cmd/tasks/main.go:46);
#   - LOG_LEVEL из методички сервис НЕ читает (уровень задан в коде,
#     shared/logger/logger.go) — поэтому его здесь нет (как и в ПЗ №15);
#   - INSTANCE_ID намеренно НЕ задаём тут: его прокидываем в Deployment из имени
#     пода (Downward API), чтобы у каждой реплики был свой id (нужно для §16.9).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tasks-config
  labels:
    app: tasks
data:
  # HTTP-порт сервиса (methodichka: 8082; дефолт в коде — 8086).
  TASKS_PORT: "8082"
  # Адрес auth по gRPC. auth в k8s не деплоим — это имя Service «на будущее»;
  # grpc.Dial ленивый (без WithBlock), поэтому недоступность auth на старте не
  # фатальна — /health и работа без авторизации поднимаются и без auth.
  AUTH_GRPC_ADDR: "auth:50051"
  # Кэш Redis (ПЗ №9) — необязателен. Пустая строка → DB-only режим (Nop-кэш).
  # В минимальном стенде Redis не поднимаем; тумблер оставлен, чтобы показать,
  # что конфигурацией кэш включается/выключается без пересборки образа.
  REDIS_ADDR: ""
  # Имя очереди событий (используется, только если задан RABBIT_URL — он в
  # минимальном стенде не задаётся, публикация best-effort и выключена).
  QUEUE_NAME: "task_events"
