# Secret сервиса tasks (ПЗ №16).
#
# ВНИМАНИЕ: это УЧЕБНЫЙ secret с демо-паролем (tasks/tasks). В реальном проекте
# такой файл НЕ коммитят в git — секреты создают из внешнего хранилища
# (Vault / sealed-secrets / `kubectl create secret ...`). Здесь он лежит в репо
# намеренно — чтобы стенд поднимался одной командой, как и docker-compose с теми
# же демо-кредами. Это прямая иллюстрация к контрольному вопросу 4: секрет
# отделён от ConfigMap, его значение base64-кодируется и хранится отдельно.
#
# Используем stringData (k8s сам закодирует в base64) — так файл читаем глазами.
apiVersion: v1
kind: Secret
metadata:
  name: tasks-secret
  labels:
    app: tasks
type: Opaque
stringData:
  # ЕДИНСТВЕННАЯ жёсткая зависимость сервиса: при недоступной БД процесс
  # завершается на старте (Fatal на pool.Ping, main.go:66). Host = имя Service
  # Postgres внутри кластера (tasks-db), не localhost.
  TASKS_DB_DSN: "postgres://tasks:tasks@tasks-db:5432/tasks?sslmode=disable"
  # Креды для самого Postgres (postgres.yaml читает их отсюда же).
  POSTGRES_USER: "tasks"
  POSTGRES_PASSWORD: "tasks"
  POSTGRES_DB: "tasks"
